# Release: every push to main (a merge from develop) builds macOS, Windows and Linux packages and publishes
# them as GitHub Release v<version>, where <version> comes from app/package.json. Bump it on develop before merging,
# add its "## [<version>]" section to CHANGELOG.md (that section opens the release notes) and move the README's
# "### Download v<version>" buttons to the new version.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "26"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./app/package.json').version")"
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Bump \"version\" in app/package.json on develop, then merge to main again."
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no \"## [$version]\" section. Add it on develop, then merge to main again."
            exit 1
          fi
          # README download buttons link straight to this release's files (asset names carry the version).
          links="$(grep -oE 'releases/download/v[^/"]+/vltn-tone-studio-[^"]+' README.md || true)"
          stale="$(printf '%s\n' "$links" | grep -v "^releases/download/$tag/vltn-tone-studio-$version-" || true)"
          if [ -z "$links" ] || [ -n "$stale" ] || ! grep -qF "### Download $tag" README.md || ! grep -qF "(#download-${tag//./})" README.md; then
            echo "::error::README.md download links are not for $tag. Replace the old version in the \"### Download\" heading, its #download-… anchor and every releases/download/… link, then merge to main again."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:toolkit

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx electron-vite build
        env:
          # Optional repository secret; without it the TONE3000 sign-in reports a missing app key.
          MAIN_VITE_T3K_CLIENT_ID: ${{ secrets.T3K_CLIENT_ID }}
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No Developer ID / Authenticode certificate yet: build unsigned instead of searching the keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.os }}
          # latest*.yml and the blockmaps are the in-app update feed (electron-builder.yml › publish).
          path: |
            app/dist/*.dmg
            app/dist/*.exe
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.blockmap
            app/dist/latest*.yml
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            .github/release-notes.md
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: packages
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -l packages
          # The app updates itself from these; a release without them would leave Windows and AppImage users behind.
          for feed in latest.yml latest-linux.yml; do
            test -s "packages/$feed" || { echo "::error::$feed is missing, the in-app updater couldn't find this release"; exit 1; }
            grep -qx "version: ${TAG#v}" "packages/$feed" || { echo "::error::$feed doesn't describe ${TAG#v}"; exit 1; }
          done
          # This version's CHANGELOG section (up to the next "## [" heading or the link list), then the install notes.
          awk -v head="## [${TAG#v}]" 'index($0, head) == 1 { on = 1; next } on && (/^## \[/ || /^\[[^]]+\]: /) { exit } on' CHANGELOG.md > notes.md
          printf '\n' >> notes.md
          cat .github/release-notes.md >> notes.md
          # Draft first, published once every file is uploaded: the updater never sees a release without its feed.
          gh release create "$TAG" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "VLTN Tone Studio $TAG" \
            --notes-file notes.md \
            --generate-notes \
            --draft
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
