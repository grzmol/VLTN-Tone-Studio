<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <!-- README banner: the app icon (the pedal knob with the engaged LED, as in the app's icon) next to the app name.
       README.md shows banner.png; regenerate it after editing this file with:
       rsvg-convert -w 1600 -h 400 assets/banner.svg -o assets/banner.png
       The text uses Open Sans; install it first so the PNG matches. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1d22"/>
      <stop offset="1" stop-color="#101012"/>
    </linearGradient>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2f"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9c9cf"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ddc84" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3ddc84" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ddc84" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3ddc84" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="400" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1598" height="398" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="300" cy="200" r="360" fill="url(#ambient)"/>
  <!-- the app icon, 1024 units scaled to 360 px -->
  <g transform="translate(120 20) scale(0.3516)">
    <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#chassis)"/>
    <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>
    <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="18" stroke-linecap="round">
      <line x1="512" y1="196" x2="512" y2="236" transform="rotate(-135 512 560)"/>
      <line x1="512" y1="196" x2="512" y2="236" transform="rotate(-90 512 560)"/>
      <line x1="512" y1="196" x2="512" y2="236" transform="rotate(-45 512 560)"/>
      <line x1="512" y1="196" x2="512" y2="236"/>
      <line x1="512" y1="196" x2="512" y2="236" transform="rotate(45 512 560)"/>
      <line x1="512" y1="196" x2="512" y2="236" transform="rotate(90 512 560)"/>
      <line x1="512" y1="196" x2="512" y2="236" transform="rotate(135 512 560)"/>
    </g>
    <circle cx="512" cy="580" r="268" fill="#000" fill-opacity="0.35"/>
    <circle cx="512" cy="560" r="268" fill="url(#knob)"/>
    <circle cx="512" cy="560" r="214" fill="none" stroke="#000" stroke-opacity="0.08" stroke-width="10"/>
    <line x1="512" y1="560" x2="512" y2="340" stroke="#141416" stroke-width="40" stroke-linecap="round" transform="rotate(45 512 560)"/>
    <circle cx="800" cy="226" r="90" fill="url(#glow)"/>
    <circle cx="800" cy="226" r="40" fill="#3ddc84"/>
  </g>
  <text x="540" y="208" font-family="Open Sans, Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-2" fill="#ffffff">VLTN <tspan fill="#3ddc84">Tone</tspan> Studio</text>
  <text x="546" y="268" font-family="Open Sans, Helvetica, Arial, sans-serif" font-size="38" font-weight="400" fill="#a4a4ad">Editor and librarian for Valeton multi-effects</text>
</svg>
